name: Backend Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r cloudrun/requirements-dev.txt
      - name: Run service tests
        env:
          USE_MOCK: true
        run: python -m pytest cloudrun/tests backtest/tests

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Smoke check
        env:
          RENDER_HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          test -n "$RENDER_HEALTHCHECK_URL"
          for attempt in $(seq 1 18); do
            if curl --fail --show-error --silent "$RENDER_HEALTHCHECK_URL"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
