name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r cloudrun/requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple
          pip install -e "backtest[dev]"

      - name: Run tests
        env:
          USE_MOCK: true
        run: |
          cd cloudrun
          python scripts/test_api_logs.py
          cd ..
          python -m pytest backtest/tests
