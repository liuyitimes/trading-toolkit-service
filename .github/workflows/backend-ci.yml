name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r cloudrun/requirements-dev.txt

      - name: Run API log self-check
        env:
          USE_MOCK: true
          ENABLE_ADMIN_API: true
        run: |
          cd cloudrun
          python scripts/test_api_logs.py

      - name: Run tests
        env:
          USE_MOCK: true
        run: python -m pytest cloudrun/tests backtest/tests
