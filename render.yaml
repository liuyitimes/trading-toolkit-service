services:
  - type: web
    name: trading-toolkit-api
    runtime: docker
    dockerfilePath: ./cloudrun/Dockerfile
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_ADMIN_API
        value: "false"
      - key: SENTRY_DSN
        sync: false
    healthCheckPath: /healthz
