[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "trading-backtest"
version = "0.1.0"
description = "A-share strategy backtester with realistic trading mechanics"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
